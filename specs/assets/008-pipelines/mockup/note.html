<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Nota mockup</title><link rel="stylesheet" href="mock.css">
<style>
.wrap{display:flex;gap:26px;margin-top:18px}
.body{flex:1;font-size:17px;line-height:1.75}
.body p{margin-bottom:8px}
.hl{background:linear-gradient(transparent 60%,#f8d98566 60%);border-bottom:1.5px dashed #b39a5f}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);background:var(--sheet);border-radius:8px;padding:2px 10px;font-size:15px;line-height:1.6}
.margin{width:250px;flex:none;border-left:1px dashed var(--hair);padding-left:16px;display:flex;flex-direction:column;gap:12px}
.mcard{background:var(--sheet);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font-size:13px}
.mcard .k{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.mcard strong{display:block;font-size:14px;margin-bottom:4px}
.mcard q{display:block;font-size:12px;color:var(--muted);font-style:italic;margin-bottom:8px}
.mcard .f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style></head>
<body><script src="icons.js"></script><script>
document.body.insertAdjacentHTML('beforeend', chrome('Notas', `
 <div class="vt"><div class="ib">${I('back','style="width:18px;height:18px"')}</div><span class="sp"></span><div class="btn primary">${I('plus')}Nova nota</div><div class="ib">${I('search','style="width:18px;height:18px"')}</div><div class="ib">${I('more','style="width:18px;height:18px"')}</div></div>
 <h1>Visita da arquiteta</h1>
 <div class="meta"><span class="pill">Pessoal</span>·<span>criada em 05/10/2026 · atualizada hoje, 10:12</span></div>
 <div class="wrap">
  <div class="body">
   <p>A arquiteta sugeriu manter a pia onde está. Antes de fechar o projeto, <span class="hl">precisamos de dois orçamentos de marcenaria</span> para comparar prazo e preço.</p>
   <p>Ela também lembrou da fiação:</p>
   <p><span class="chip">${I('kanban','style="width:14px;height:14px"')}<b style="font-weight:600">Trocar a fiação da bancada</b><span class="pill">Doing</span></span></p>
   <p><span class="chip">${I('kanban','style="width:14px;height:14px"')}<b style="font-weight:600">Tirar fotos do antes</b><span class="pill done">${I('tick')}Done</span></span></p>
   <p style="color:var(--muted)">Próxima visita na semana que vem.</p>
  </div>
  <div class="margin">
   <div class="mcard"><div class="k">${I('kanban','style="width:12px;height:12px"')}Tarefa · Reforma da cozinha</div><strong>Pedir dois orçamentos de marcenaria</strong><q>precisamos de dois orçamentos de marcenaria</q><div class="f"><span class="pill">Ready to Dev</span><span class="sp" style="flex:1"></span><div class="ib" style="width:22px;height:22px">${I('pencil','style="width:13px;height:13px"')}</div><div class="ib" style="width:22px;height:22px">${I('x','style="width:13px;height:13px"')}</div></div></div>
   <div class="mcard"><div class="k">${I('bell','style="width:12px;height:12px"')}Lembrete</div><strong>Ligar para a arquiteta</strong><div class="f"><span>08/10, 09:00</span></div></div>
  </div>
 </div>
 <span class="callout" style="left:40px;top:180px">1</span>
 <span class="callout" style="left:40px;top:278px">2</span>
 <span class="callout" style="left:722px;top:150px">3</span>
 <div class="legend">1 trecho que originou uma tarefa (destaque tracejado, como hoje) · 2 linha criada com [] vira a tarefa: título + pill da coluna atual; clique abre o modal · 3 margem: tarefa com nome do pipeline e pill da coluna, sem checkbox</div>
`));
</script></body></html>
