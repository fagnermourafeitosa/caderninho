<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quadro mockup</title>
<style>
@font-face{font-family:'New York';src:local('New York'), url('/System/Library/Fonts/NewYork.ttf') format('truetype');font-weight:100 1000}
@font-face{font-family:'Excalifont';src:url('../../../../src/renderer/fonts/excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2')}
:root{--paper:#fbf0d5;--shade:#efe0b9;--kraft:#e6d3a8;--sheet:#fffaea;--hover:#f3e5c2;--hair:#cdb88a;--ink:#303025;--muted:#6b624c;--edge:#36352a;--yellow:#f8d985}
*{box-sizing:border-box;margin:0}
body{background:#000;width:1280px;height:860px;font-family:'New York',Georgia,serif;color:var(--ink);padding:18px 40px 22px 18px;display:flex;gap:22px}
svg.i{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{width:206px;background:linear-gradient(#e6d3a8,#e0cc9f);border:2px solid var(--edge);border-radius:16px;padding:26px 14px}
.side h6{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:650;margin:0 0 14px 12px}
.row{display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;border-radius:8px;font-size:15.5px;margin-bottom:4px}
.row.on{background:var(--yellow);font-weight:650}
.row.gap{margin-top:22px}
.book{flex:1;position:relative;background:var(--paper);border:2px solid var(--edge);border-radius:18px;box-shadow:0 6px 0 -1px #e9d9b3,0 6px 0 1px var(--edge);display:flex;flex-direction:column;padding:0 30px 0 60px;overflow:visible}
.book:before{content:"";position:absolute;left:14px;top:12px;bottom:12px;border-left:1.5px dashed #8b7d5a}
.book:after{content:"";position:absolute;left:26px;top:0;bottom:0;border-left:1px solid var(--hair)}
.fold{position:absolute;left:-12px;top:150px;width:18px;height:52px;background:var(--sheet);border:1.5px solid var(--edge);border-radius:6px;display:grid;place-items:center}
.tabs{position:absolute;z-index:5;right:-30px;top:120px;display:flex;flex-direction:column;gap:12px}
.tab{width:30px;border:1.5px solid var(--edge);border-left:none;border-radius:0 9px 9px 0}
.tab.a{height:200px;background:#e6d3a8;font-family:Excalifont;writing-mode:vertical-rl;font-size:17px;padding:28px 0 0 2px}
.tab.b{height:56px;background:#c9d8df}.tab.c{height:56px;background:#cfdcbc}
.tab.d{height:44px;background:var(--sheet);display:grid;place-items:center;font-size:22px}
.bar{height:68px;display:flex;align-items:center;gap:8px;flex:none}
.bar .sp{flex:1}
.btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:9px;font-size:15px;font-weight:650}
.btn.primary{background:var(--ink);color:var(--paper)}.btn.primary svg{stroke:var(--paper)}
.ib{width:34px;height:34px;display:grid;place-items:center}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pill{border:1px solid var(--hair);background:#f1e4c4;border-radius:999px;padding:3px 10px;color:var(--ink)}
.canvas{position:relative;flex:1;margin:18px -30px 0 -34px;border-top:1px solid var(--hair);border-radius:0 0 16px 0;overflow:hidden;
  background-color:var(--paper);background-image:radial-gradient(#d6c497 1.1px,transparent 1.3px);background-size:22px 22px;background-position:6px 6px}
.canvas>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.rail{position:absolute;left:14px;top:22px;background:var(--sheet);border:1px solid var(--hair);border-radius:12px;box-shadow:0 3px 10px rgba(54,53,42,.12);padding:6px;display:flex;flex-direction:column;gap:2px}
.rail .t{width:36px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative}
.rail .t.on{background:var(--yellow)}
.rail .t small{position:absolute;right:3px;bottom:1px;font-size:8.5px;color:var(--muted);font-family:-apple-system,sans-serif}
.rail hr{border:none;border-top:1px solid var(--hair);margin:4px 6px}
.ctx{position:absolute;background:var(--sheet);border:1px solid var(--hair);border-radius:11px;box-shadow:0 4px 14px rgba(54,53,42,.16);height:42px;padding:0 6px;display:flex;align-items:center;gap:2px}
.ctx .c{height:32px;min-width:32px;padding:0 6px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px}
.ctx .c.on{background:var(--hover)}
.ctx .sep{width:1px;height:22px;background:var(--hair);margin:0 4px}
.sw{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--edge)}
.chev{width:8px;height:8px;stroke:var(--muted)!important}
.pop{position:absolute;background:var(--sheet);border:1px solid var(--hair);border-radius:11px;box-shadow:0 4px 14px rgba(54,53,42,.16);padding:10px;font-size:12px;color:var(--muted)}
.pop .grid{display:grid;grid-template-columns:repeat(5,24px);gap:7px;margin:6px 0 10px}
.pop .grid span{width:24px;height:24px;border-radius:6px;border:1px solid var(--hair)}
.pop .grid span.sel{outline:2px solid var(--ink);outline-offset:1px}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;gap:8px}
.grp{background:var(--sheet);border:1px solid var(--hair);border-radius:10px;height:36px;display:flex;align-items:center;padding:0 4px;font-size:13px;box-shadow:0 2px 6px rgba(54,53,42,.08)}
.grp .ib{width:30px;height:30px}
.grp b{font-weight:400;min-width:44px;text-align:center;color:var(--muted)}
.foot{position:absolute;right:16px;bottom:22px;font-size:12px;color:var(--muted)}
.callout{position:absolute;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:11.5px;font-weight:600;color:#fff;background:#b2452f;border-radius:999px;width:20px;height:20px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}

.vt{height:68px;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.page{max-width:720px}
.desc{font-size:13px;color:var(--muted);margin:8px 0 18px}
.search{width:100%;padding:8px 10px;background:var(--sheet);border:1px solid var(--hair);border-radius:8px;font:13px 'New York',Georgia,serif;color:var(--muted);margin:2px 0 10px}
.ir{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border:none;background:none;border-bottom:1px solid #b8a27855;border-radius:6px;text-align:left;font-family:inherit;color:var(--ink)}
.ir.hover{background:var(--hover)}
.th{flex:none;width:64px;height:40px;border-radius:4px;border:1px solid var(--hair);background:var(--paper);overflow:hidden;display:block}
.th svg{display:block;width:100%;height:100%}
.tx{min-width:0}.tx strong{display:block;font-size:15px;font-weight:600;line-height:1.35}
.tx small{display:block;margin-top:4px;font-size:12px;line-height:1.5;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:610px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding-bottom:80px}
.empty svg.il{width:68px;height:68px;margin-bottom:16px;opacity:.85;color:var(--ink)}
.empty h2{font-size:18px;font-weight:normal;color:var(--ink);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.7}
.empty .pb{margin-top:20px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
</style>
</head>
<body>
